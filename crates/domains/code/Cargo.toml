[package]
name = "onto-assurance-domain-code"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"
description = "Code Assurance Domain Plugin — code-specific verifiers, rules, and location resolvers"

[dependencies]
onto-assurance-types = { path = "../../onto-assurance-types" }
onto-assurance-core = { path = "../../onto-assurance-core" }
onto-assurance-runtime = { path = "../../onto-assurance-runtime" }
onto-pack = { path = "../../onto-pack" }
onto-pack-sdk = { path = "../../onto-pack-sdk" }
onto-protocol = { path = "../../onto-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }

[features]
test-support = []

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }

[lints]
workspace = true
