[package]
name = "onto-assurance-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"
description = "Onto Assurance Kernel — deterministic pure functions: hash, reduction, decision, replay"

[dependencies]
onto-assurance-types = { path = "../onto-assurance-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }

[lints]
workspace = true
