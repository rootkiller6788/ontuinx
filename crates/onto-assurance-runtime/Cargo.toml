[package]
name = "onto-assurance-runtime"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"
description = "Onto Assurance Kernel — runtime coordinator and port traits"

[dependencies]
onto-assurance-types = { path = "../onto-assurance-types" }
onto-assurance-core = { path = "../onto-assurance-core" }
onto-protocol = { path = "../onto-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[features]
test-support = []

[lints]
workspace = true
