[package]
name = "onto-graph-mcp"
version = "0.1.0"
edition = "2021"
description = "P10: OntoCodeGraph MCP Server — registered into IronClaw MCP registry"

[[bin]]
name = "onto-graph-mcp"
path = "src/main.rs"

[dependencies]
ontofirmwaregraphd = { path = "../onto-graph-service" }
tonic = "0.12"
prost = "0.13"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4"] }
axum = "0.7"
