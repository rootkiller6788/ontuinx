[package]
name = "ontofirmwaregraphd"
version = "0.1.0"
edition = "2021"
description = "OntoFirmwareGraph — shared-memory code graph service (P3)"

[lib]
name = "onto_graph_service"
path = "src/lib.rs"

[dependencies]
tonic = "0.12"
prost = "0.13"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
libc = "0.2"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "migrate"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
sha2 = "0.10"
hex = "0.4"

[build-dependencies]
tonic-build = "0.12"
