[package]
name = "onto-integration-test"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"
description = "M4–M6 integration: Onto Assurance Kernel shadow mode + Builtin gate tests"

[dependencies]
onto-assurance-types = { path = "../onto-assurance-types" }
onto-assurance-core = { path = "../onto-assurance-core" }
onto-code-pack = { path = "../onto-code-pack" }
onto-assurance-runtime = { path = "../onto-assurance-runtime" }
onto-ironclaw-adapter = { path = "../onto-ironclaw-adapter" }
onto-loop = { path = "../onto-loop" }
onto-protocol = { path = "../onto-protocol" }
onto-temporal-adapter = { path = "../onto-temporal-adapter" }
onto-pack-sdk = { path = "../onto-pack-sdk" }
onto-assurance-domain-code = { path = "../domains/code" }
onto-pack = { path = "../onto-pack" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
sha2 = "0.10"
hex = "0.4"
