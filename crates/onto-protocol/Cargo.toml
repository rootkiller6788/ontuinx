[package]
name = "onto-protocol"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "OntoOS protocol types — single source of truth for cross-layer types"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
